aid: accutar-biotechnology
name: Accutar Biotechnology
description: 'Accutar Biotechnology Inc. is a clinical-stage biotechnology company headquartered
  in Cranbury, New Jersey, founded in 2015 and previously based in Brooklyn, New York, with operations
  in Shanghai. It applies deep learning to small-molecule drug discovery and runs its own oncology
  pipeline, including the AC0682 and AC0176 protein degraders in Phase 1 trials. Its computational
  platform is a set of in-house AI products used in its own preclinical workflow and offered to partners:
  ChemiRise (retrosynthesis), Orbital (neural-network docking), Virtual Screen, Intelligent-SAR,
  Chemi-Net (ADME prediction) and the PatentOne AI suite (InsightOne, GenusOne). Accutar publishes
  no developer program: no public API, developer portal, reference documentation, machine-readable
  specification or SDK exists on any host it operates. Access to the AI products is arranged by email
  enquiry for a trial or demo.'
